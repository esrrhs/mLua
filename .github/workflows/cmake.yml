name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential lua5.3 liblua5.3-dev \
          graphviz google-perftools golang-go
        sudo update-alternatives --install /usr/bin/lua lua /usr/bin/lua5.3 100 || true
        lua -v || lua5.3 -v
        go version

    - name: Build and test
      run: |
        chmod +x ./build.sh
        ./build.sh

    - name: Run profiling demo and visualization tools
      run: |
        cd test
        lua test_static_perf.lua || lua5.3 test_static_perf.lua
        cd ../tools
        chmod +x ./show.sh
        ./show.sh ../test
